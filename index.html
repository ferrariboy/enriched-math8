<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Enriched Math 8: self learning, practice worksheets and a Gauss contest simulator for BC Grade 8 enriched math.">
<title>Enriched Math 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Enriched Math 8: app shell styles. Engine and simulator inject their own me-* and gs-* styles. */
:root{--bg:#F7F3EA;--surface:#FFFFFF;--surface2:#EEE7D6;--ink:#14213D;--muted:#4B5872;--line:#D6CEB8;--grid:rgba(20,33,61,0.07);--accent:#2450E0;--accent-ink:#FFFFFF;--ok:#0B7A53;--warn:#8A5A00;--bad:#B3261E}
.em-root.dark,html.dark{--bg:#0E1424;--surface:#172038;--surface2:#212D4E;--ink:#EEF1FA;--muted:#A9B4CF;--line:#2E3B5F;--grid:rgba(238,241,250,0.07);--accent:#8FA8FF;--accent-ink:#0E1424;--ok:#5BD6A0;--warn:#F2C25B;--bad:#FF8A80}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--bg)}
.em-root{min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,sans-serif;font-size:17px;line-height:1.45}
.em-root *{box-sizing:border-box}
.em-root a{color:var(--accent)}
.em-disp{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-0.01em}
.em-shell{display:flex;min-height:100vh}
.em-side{width:264px;flex:none;position:sticky;top:0;height:100vh;padding:24px 16px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:28px}
.em-brand{display:flex;align-items:center;gap:12px;padding:4px 8px}
.em-logo{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.em-nav{display:flex;flex-direction:column;gap:6px}
.em-nav a{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border-radius:12px;color:var(--ink);text-decoration:none;font-size:16px;font-weight:600;position:relative}
.em-root .em-nav a{color:var(--ink)}
.em-nav a:hover{background:var(--surface2)}
.em-root .em-nav a.on,.em-root .em-nav a.on:hover{background:var(--accent);color:var(--accent-ink)}
.em-glyph{width:28px;text-align:center;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:20px;font-weight:700}
.em-short{display:none}
.em-pill{margin-left:auto;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--warn);color:var(--surface);white-space:nowrap}
.em-sidefoot{margin-top:auto;padding:14px;border-radius:14px;background:var(--surface2)}
.em-main{flex:1;min-width:0;padding:28px 40px 72px}
.em-page{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.em-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.em-crumbs{font-size:14px;font-weight:600;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.em-crumbs a{color:var(--muted);text-decoration:none}.em-crumbs a:hover{color:var(--accent);text-decoration:underline}
.em-view[hidden]{display:none}
.em-view{display:flex;flex-direction:column;gap:24px}
.em-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}
.em-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;touch-action:manipulation}
.em-root a.em-btn{color:var(--ink)}
.em-btn:hover{background:var(--surface2)}
.em-btn.primary,.em-root a.em-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.em-btn.primary:hover{filter:brightness(1.08)}
.em-btn.small{min-height:40px;padding:0 14px;font-size:15px}
.em-btn:disabled{opacity:.55;cursor:not-allowed}
.em-chip{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
.em-chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.em-tier{display:flex;flex-direction:column;gap:4px;text-align:left;min-height:88px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-family:inherit;cursor:pointer}
.em-tier.on{border-color:var(--accent);background:var(--surface2);box-shadow:inset 0 0 0 1px var(--accent)}
.em-check{flex:none;width:40px;height:40px;border-radius:10px;border:2px solid var(--ink);background:transparent;color:var(--accent-ink);font-size:20px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.em-check.on{background:var(--ok);border-color:var(--ok)}
.em-root.dark .em-check.on{color:#0E1424}.em-root:not(.dark) .em-check.on{color:#fff}
.em-bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.em-fill{height:100%;border-radius:99px;background:var(--accent)}
.em-paper{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.em-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px}
.em-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.em-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.em-three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.em-col{display:flex;flex-direction:column;gap:14px}
.em-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.em-muted{color:var(--muted)}
.em-h2{margin:0;font-size:26px;font-weight:800}
.em-tile{width:56px;height:56px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:30px;font-weight:800;color:#14213D}
.em-root.dark .em-tile{color:#EEF1FA}
.tile-m1{background:#CFE0FF}.tile-m2{background:#FFE2B8}.tile-m3{background:#D3EFDB}.tile-m4{background:#F6D0E2}.tile-m5{background:#E1D8FB}.tile-m6{background:#FFD4CC}
.em-root.dark .tile-m1{background:#22366B}.em-root.dark .tile-m2{background:#5A3E10}.em-root.dark .tile-m3{background:#1E4A33}.em-root.dark .tile-m4{background:#5A2444}.em-root.dark .tile-m5{background:#3A2F6E}.em-root.dark .tile-m6{background:#5C2A22}
.em-input,.em-text{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit;font-size:17px}
.em-text{padding:12px 14px;min-height:110px;resize:vertical}
.em-input:focus,.em-text:focus{outline:3px solid var(--accent);outline-offset:1px}
.em-btn:focus-visible,.em-chip:focus-visible,.em-nav a:focus-visible,.em-tier:focus-visible,.em-check:focus-visible,.em-opt:focus-visible,.em-crumbs a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.em-locked{opacity:.78}
.em-toprow{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:var(--surface2)}
.em-toprow .grow{flex:1;min-width:0}
/* lessons */
.em-lessonwrap{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px}
.em-lessonwrap .me-lesson{max-width:720px}
/* practice */
.em-q{display:flex;flex-direction:column;gap:12px}
.em-qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:700}
.em-qtext{font-size:1.15em;line-height:1.6}
.em-opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.em-opt{display:flex;gap:12px;align-items:center;min-height:56px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-family:inherit;font-size:1.05em;text-align:left;cursor:pointer}
.em-opt b{flex:none;width:34px;height:34px;border-radius:9px;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.em-opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.em-opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.em-opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.em-fb{padding:12px 16px;border-radius:12px;font-weight:600}
.em-fb.ok{background:color-mix(in srgb,var(--ok) 16%,var(--surface));border:1px solid var(--ok)}
.em-fb.no{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border:1px solid var(--bad)}
.em-sol{padding:14px 16px;border-radius:12px;background:var(--surface2)}
.em-pad{border:2px dashed var(--line);border-radius:12px;background:var(--surface);touch-action:none;width:100%;height:220px;display:block}
.em-det summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.em-sticky{position:sticky;top:8px;z-index:5}
/* modal, toast */
.em-modal{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.em-modal[hidden]{display:none}
.em-sheet{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
@media(min-width:700px){.em-modal{align-items:center}}
.em-toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90vw}
.em-toast.show{opacity:1;transform:translate(-50%,0)}
.em-stars{display:flex;gap:8px}
.em-stars button{width:52px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;font-weight:800;cursor:pointer}
.em-stars button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.em-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:860px){
  .em-shell{flex-direction:column}
  .em-side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:20;gap:0}
  .em-brand,.em-sidefoot{display:none}
  .em-nav{flex-direction:row;width:100%;gap:2px}
  .em-nav a{flex:1;flex-direction:column;justify-content:center;gap:2px;min-height:60px;padding:6px 2px;font-size:13px;text-align:center}
  .em-pill{position:absolute;top:2px;right:2px;margin:0;padding:2px 6px;font-size:9px}
  .em-full{display:none}.em-short{display:inline}
  .em-main{padding:20px 16px 120px}
  .em-hero,.em-two,.em-three{grid-template-columns:minmax(0,1fr)}
  .em-root{font-size:18px}
  .em-btn{min-height:52px}.em-chip{min-height:48px;font-size:16px}
  .em-h1{font-size:38px!important}
  .em-toast{bottom:100px}
}
@media (prefers-reduced-motion:reduce){.em-toast{transition:none}}

</style>
</head>
<body>
<div id="em" class="em-root">
  <div class="em-shell">
    <aside class="em-side">
      <div class="em-brand">
        <div class="em-logo em-disp" aria-hidden="true">π</div>
        <div><div class="em-disp" style="font-size:20px;font-weight:800;line-height:1.1">Enriched Math 8</div><div style="font-size:13px;color:var(--muted)">BC Enriched and Gauss prep</div></div>
      </div>
      <nav id="em-nav" class="em-nav" aria-label="Main navigation"></nav>
      <div id="em-sidefoot" class="em-sidefoot"></div>
    </aside>
    <main id="app-content" class="em-main">
      <div class="em-page">
        <header class="em-top">
          <div>
            <nav id="em-crumbs" class="em-crumbs" aria-label="Breadcrumb"></nav>
            <h2 id="em-title" class="em-disp" style="margin:0;font-size:30px;font-weight:800"></h2>
          </div>
          <div class="em-row">
            <button id="em-feedback" class="em-btn">Feedback</button>
            <button id="em-theme" class="em-btn" aria-pressed="false">Dark mode</button>
          </div>
        </header>
        <section id="v-dashboard" class="em-view" aria-label="Dashboard"></section>
        <section id="v-learn" class="em-view" aria-label="Self Learning" hidden></section>
        <section id="v-practice" class="em-view" aria-label="Practice Generator" hidden></section>
        <section id="v-gauss" class="em-view" aria-label="Gauss Simulator" hidden></section>
        <section id="v-progress" class="em-view" aria-label="Student Progress" hidden></section>
      </div>
    </main>
  </div>
  <div id="em-fb" class="em-modal" hidden role="dialog" aria-modal="true" aria-label="Feedback">
    <div class="em-sheet" id="em-fb-body"></div>
  </div>
  <div id="em-toast" class="em-toast" role="status" aria-live="polite"></div>
</div>
<noscript>Enriched Math 8 needs JavaScript. Please turn it on in your browser.</noscript>
<script>
/*!
 * mathEngine.js  v1.0.0
 * Content and question engine for Enriched Math 8.
 * Global: window.MathEngine (also module.exports in Node).
 *
 * Main calls:
 *   MathEngine.generateQuestion(moduleId, topicId, tier, opts)
 *   MathEngine.generateWorksheet({ moduleId, topicId, tier, count, mc })
 *   MathEngine.checkAnswer(question, userInput)
 *   MathEngine.renderContent(markdownOrHtml)      -> html string
 *   MathEngine.renderLesson(topicId)              -> html string
 *   MathEngine.renderQuestion(question, options)  -> html string
 *   MathEngine.mount(element, markdownOrHtml)
 *   MathEngine.registerModule(definition)         -> plug in Modules 2 to 6 later
 *
 * Math markup used inside questions and lessons:
 *   {{n|d}}  stacked fraction (may be nested)     x^{n}  superscript
 *   √{x}  square root with bar                    ∛{x}   cube root with bar
 */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) { module.exports = api; }
  root.MathEngine = api;
})(typeof window !== 'undefined' ? window : globalThis, function () {
  'use strict';

  /* ================================================================
     1. Random numbers (seeded, so any question can be replayed)
  ================================================================ */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var masterRng = mulberry32((Date.now() ^ Math.floor(Math.random() * 4294967296)) >>> 0);
  function newSeed() { return Math.floor(masterRng() * 4294967296) >>> 0; }
  function makeR(seed) {
    var f = mulberry32(seed);
    return {
      next: f,
      int: function (a, b) { return a + Math.floor(f() * (b - a + 1)); },
      pick: function (arr) { return arr[Math.floor(f() * arr.length)]; },
      chance: function (p) { return f() < (p == null ? 0.5 : p); },
      shuffle: function (arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(f() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }

      }
    };
  }

  /* ================================================================
     2. Number helpers
  ================================================================ */
  var MINUS = '−';
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a; }
  function lcm(a, b) { return a / gcd(a, b) * b; }
  function isPrime(n) { if (n < 2) return false; for (var i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; }
  function factorize(n) {
    var out = [];
    for (var p = 2; p * p <= n; p++) { var e = 0; while (n % p === 0) { n /= p; e++; } if (e) out.push([p, e]); }
    if (n > 1) out.push([n, 1]);
    return out;
  }
  function primeList(n) { var l = []; factorize(n).forEach(function (pe) { for (var i = 0; i < pe[1]; i++) l.push(pe[0]); }); return l; }
  function factorStr(n) { return factorize(n).map(function (pe) { return pe[1] > 1 ? pe[0] + '^{' + pe[1] + '}' : '' + pe[0]; }).join(' × '); }
  function countDivisors(n) { var c = 0; for (var i = 1; i * i <= n; i++) if (n % i === 0) c += (i * i === n) ? 1 : 2; return c; }
  function pow(b, e) { var x = 1; for (var i = 0; i < e; i++) x *= b; return x; }
  function modpow(b, e, m) { var res = 1 % m; b = b % m; while (e > 0) { if (e % 2 === 1) res = res * b % m; b = b * b % m; e = Math.floor(e / 2); } return res; }
  function isqrt(n) { var s = Math.floor(Math.sqrt(n)); while (s * s > n) s--; while ((s + 1) * (s + 1) <= n) s++; return s; }
  function digitSum(n) { return String(n).split('').reduce(function (a, c) { return a + (+c); }, 0); }

  // Integer formatting: real minus sign, commas only from 5 digits up
  function fmt(n) {
    var s = String(Math.abs(n));
    if (s.length > 4) s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (n < 0 ? MINUS : '') + s;
  }

  // Fractions
  function F(n, d) {
    if (d === undefined) d = 1;
    if (d < 0) { n = -n; d = -d; }

  }
  function fadd(a, b) { return F(a.n * b.d + b.n * a.d, a.d * b.d); }
  function fsub(a, b) { return F(a.n * b.d - b.n * a.d, a.d * b.d); }
  function fmul(a, b) { return F(a.n * b.n, a.d * b.d); }
  function fdiv(a, b) { return F(a.n * b.d, a.d * b.n); }
  function fpow(a, e) { return F(Math.pow(a.n, e), Math.pow(a.d, e)); }
  function fval(a) { return a.n / a.d; }
  function fstr(f) { return f.d === 1 ? fmt(f.n) : (f.n < 0 ? MINUS : '') + Math.abs(f.n) + '/' + f.d; }
  function fmk(f) { return f.d === 1 ? fmt(f.n) : (f.n < 0 ? MINUS : '') + '{{' + Math.abs(f.n) + '|' + f.d + '}}'; }
  function fr(n, d) { return '{{' + n + '|' + d + '}}'; }

  // Parse a typed or stored answer into a number when possible
  function parseAnswer(s) {
    s = String(s).trim().replace(/[−–—]/g, '-').replace(/[,\s$]/g, '');
    var m = /^(-?\d+)\/(\d+)$/.exec(s);
    if (m) return +m[1] / +m[2];
    if (/^-?\d+(\.\d+)?$/.test(s)) return +s;
    return NaN;
  }

  /* ================================================================
     3. Math markup to plain text and to HTML
  ================================================================ */
  var SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '−': '⁻' };
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function simple(x) { return /^[\d−.,a-z]+$/i.test(x); }

  function toPlain(s) {
    var prev;
    do {
      prev = s;
      s = s.replace(/\{\{([^{}|]*)\|([^{}]*)\}\}/g, function (_, n, d) { return (simple(n) ? n : '(' + n + ')') + '/' + (simple(d) ? d : '(' + d + ')'); });
      s = s.replace(/\^\{([^{}]*)\}/g, function (_, x) { return /^[\d−]+$/.test(x) ? x.replace(/./g, function (c) { return SUP[c]; }) : '^(' + x + ')'; });
      s = s.replace(/∛\{([^{}]*)\}/g, function (_, x) { return '∛' + (simple(x) ? x : '(' + x + ')'); });

    return s;
  }

  function mathToHtml(s) {
    var prev;
    do {
      prev = s;
      s = s.replace(/\{\{([^{}|]*)\|([^{}]*)\}\}/g, '<span class="me-frac"><span class="me-n">$1</span><span class="me-d">$2</span></span>');
      s = s.replace(/\^\{([^{}]*)\}/g, '<sup>$1</sup>');
      s = s.replace(/∛\{([^{}]*)\}/g, '<span class="me-rad"><sup class="me-idx">3</sup>√<span class="me-vin">$1</span></span>');

  }
  function toHtml(s) { return mathToHtml(esc(s)); }

  /* ================================================================
     4. Visuals: inline SVG and pure CSS frames
        Colors come from CSS classes, so they follow light and dark themes.
  ================================================================ */
  var V = {};

  var L = {
    m2t0: '## Scaling and rates\nA **rate** compares two quantities, like litres per minute. A **scale factor** tells you how many times bigger a recipe or a plan is.\n:::visual tapeDiagram 3 5\nWhen the numbers are awkward, find the scale factor first and simplify it. Scaling 6 pancakes to 20 uses the factor {{20|6}} = {{10|3}}, so divide by 3 before you multiply by 10.\n> Convert units at the start. 1 litre = 1000 cm³, 1 km/h = {{50|3}} metres per minute.\n### Average speed and shared jobs\nAverage speed is total distance ÷ total time. Two people working together add their **rates**, not their times.\n### Worked example\n:::worked m2t0 2',
    m2t1: '## Closing and opening gaps\nTwo objects moving **toward** each other close the gap at the **sum** of their speeds. Moving in the **same direction**, the faster one gains at the **difference**.\n:::visual motionDiagram toward 60 40\n:::visual motionDiagram chase 50 70\nMoving **apart** in opposite directions, the gap grows at the sum of the speeds. At right angles, use the Pythagorean theorem on the two distances.\n:::visual motionDiagram apart 50 70\n> Head starts: compute the gap first, then divide it by the closing speed.\n### Worked example\n:::worked m2t1 2',
    m2t2: '## Percent means per hundred\nTo find a percent of a number, turn the percent into a decimal multiplier: 250% = 2.5, 0.05% = 0.0005.\nBefore you calculate, guess the size. A percent over 100 makes a number bigger. A percent under 1 makes it tiny.\n> Percent change always compares with the **starting** value. Going up 25% and then down 25% does not return to the start.\nTo undo a percent change, **divide** by the multiplier. If a price rose 35% to $270, the old price was 270 ÷ 1.35 = $200.\n### Worked example\n:::worked m2t2 2',
    m2t3: '## Multipliers for money\nA discount of 30% means you pay 70%, so multiply by 0.70. A 12% tax multiplies by 1.12. GST 5% and PST 7% in British Columbia are both worked out on the pre tax price, so together they add 12%.\nSuccessive changes **multiply**: up 20% then down 20% is 1.20 × 0.80 = 0.96, a 4% drop overall.\n> Compound interest uses the multiplier once per year: $1000 at 5% for 3 years is 1000 × 1.05^{3}.\nSimple interest adds the same amount every year: interest = principal × rate × time.\n### Worked example\n:::worked m2t3 2',
    m2t4: '## Mixtures\nWhen you mix things, the **amounts** add. Percents and prices do not. Work with the actual quantity of the ingredient.\n:::visual tapeDiagram 2 3\nFor a ratio 2 : 3 of concentrate to water, there are 5 equal parts. In 20 litres each part is 4 litres.\n> Alligation shortcut: to reach a target strength, the amounts you mix are in the **reverse** ratio of the distances from the target.\nWhen you add pure water or let water evaporate, the amount of the other ingredient stays fixed. Solve for the new total.\n### Worked example\n:::worked m2t4 2',
    m3t0: '## Expressions and the coordinate plane\nAn **expression** turns a situation into symbols. A fixed fee is a constant. A charge per unit multiplies the variable: $5 plus $2 per km is 5 + 2n.\nTo **evaluate**, replace each letter with its value inside brackets, then follow the order of operations.\n:::visual coordinatePlane 3 2 -4 3 -2 -5 5 -3\nThe plane has four quadrants. A is in I, B is in II, C is in III and D is in IV. Reflecting in the x axis flips the sign of y. Reflecting in the y axis flips the sign of x.\n> Contest trick: you can often find x² + y² from x + y and xy without finding x and y.\n### Worked example\n:::worked m3t0 2',
    m3t1: '## Linear equations\nAn equation is a balance. Whatever you do to one side you must do to the other. The goal is to get the variable alone.\nFor brackets, **expand first**, then collect the x terms on one side and the numbers on the other.\nFor fractions, multiply both sides by the LCM of the denominators. The fractions vanish.\n> Always check your answer by substituting it back into the original equation.\nA system of two equations needs two steps: eliminate one variable, solve, then back substitute.\n### Worked example\n:::worked m3t1 2',
    m3t2: '## Arithmetic sequences\nAn **arithmetic sequence** goes up or down by the same **common difference** d each time.\nThe nth term is a + (n ' + MINUS + ' 1)d, where a is the first term. The number of steps from the 1st to the nth term is n ' + MINUS + ' 1.\n> To count terms in a list, use (last ' + MINUS + ' first) ÷ d + 1.\nTo add the terms, pair the first with the last. Every pair has the same total, so sum = number of terms × (first + last) ÷ 2.\n### Worked example\n:::worked m3t2 2',
    m3t3: '## Growing patterns\nFor each pattern ask two questions: what does Step 1 have, and what changes from one step to the next?\n:::visual matchRow square 3\nThree squares in a row use 10 sticks. The first square needs 4 and each new square adds 3, so the rule is 3n + 1.\n:::visual borderTiles 3\nA border around an n by n pool needs 4n + 4 tiles. If the changes between steps are constant, the rule is linear. If the changes themselves grow by a constant amount, the rule involves n².\n> Check your rule on Steps 1, 2 and 3 before you trust it for Step 50.\n### Worked example\n:::worked m3t3 2',
    m3t4: '## Substitution and balance\nWhen letters depend on each other, express everything in terms of one letter and solve for it.\nIf you have symmetrical equations like A + B = 12, B + C = 15, A + C = 11, add them all. You get 2(A + B + C) = 38, so A + B + C = 19, and each letter follows by subtraction.\n> Balance puzzles are equations in disguise. Convert every shape into the same unit, such as squares.\nWhen a puzzle gives sums of all groups but one, add every sum. Each item was counted the same number of times, so you can recover the total.\n### Worked example\n:::worked m3t4 2'

  var L = {
    m4t0: '## Pythagoras and the right triangle\nIn a right triangle the two **legs** meet at the right angle. The side opposite it is the **hypotenuse**, always the longest. The rule is a^{2} + b^{2} = c^{2}.\n:::visual rightTriangle 3 4 5 3 4\nLearn the triples 3, 4, 5 and 5, 12, 13 and 8, 15, 17 and 7, 24, 25. Any multiple of a triple is a triple too, so 9, 12, 15 works.\nWhen a figure looks complicated, hunt for right angles and split it into right triangles. Use the shared side as a bridge from one triangle to the next.\n> Area two ways: the altitude to the hypotenuse is (leg × leg) ÷ hypotenuse.\n### Worked example\n:::worked m4t0 2',
    m4t1: '## Solids, surface area and space diagonals\n**Surface area** is the total area of all the faces. For any prism: SA = 2 × (base area) + (base perimeter) × height.\n:::visual box3d 3 4 12 1\nThe **space diagonal** of a box joins opposite corners through the inside. Use Pythagoras twice, or jump straight to D^{2} = l^{2} + w^{2} + h^{2}. This box has D^{2} = 9 + 16 + 144 = 169, so D = 13.\nFor painted cube puzzles, remove one layer from every side to find the unpainted core. Corners have 3 painted faces, edges 2, face centres 1.\n> An ant on the outside of a box takes the shortest route by unfolding two faces flat and drawing a straight line.\n### Worked example\n:::worked m4t1 3',
    m4t2: '## Composite shapes and scaling\nSplit a complicated shape into rectangles, triangles and circles, or subtract a cut out piece from a big shape. A notch cut out of a corner never changes the perimeter.\n:::visual shaded ring\nWhen every length is multiplied by k: lengths scale by **k**, areas by **k^{2}**, and volumes by **k^{3}**. Doubling the sides of a square makes the area 4 times as big. Doubling the edges of a cube makes the volume 8 times as big.\nPercent changes behave the same way. Sides 20% longer means area 1.2 × 1.2 = 1.44 times, an increase of 44%.\n> Always decide first: is the quantity a length, an area or a volume?\n### Worked example\n:::worked m4t2 2',
    m4t3: '## Angles, parallel lines and polygons\nAngles on a straight line add to 180°. Angles around a point add to 360°. Angles in a triangle add to 180°.\n:::visual parallelTransversal 4 65° 6 ?\nHere the marked angles are alternate angles, so they are equal. When a line crosses two **parallel** lines: corresponding angles are equal, alternate angles are equal, and co-interior angles add to 180°. Acute angles match acute angles.\n:::visual bentLine 40 35 ?\nA bend between two parallel lines equals the sum of the two outer angles. Draw a helper line through the bend parallel to the others.\nFor a polygon with n sides the interior angles add to (n ' + MINUS + ' 2) × 180°. Exterior angles of any polygon add to 360°, so a regular polygon has exterior angles of 360° ÷ n.\n:::visual polygonAngles 6\n### Worked example\n:::worked m4t3 2',
    m4t4: '## Shaded areas\nShaded area problems are mostly **subtraction**: whole shape minus the pieces you do not want. Or **addition**: shaded pieces that add up to a simple shape.\n:::visual shaded inscribed\nA circle inside a square touching all four sides has radius half the side, so the shaded corners have area s^{2} ' + MINUS + ' π(s/2)^{2}.\n:::visual shaded lens\nFor an overlap, add the two pieces then subtract the whole. That is the lens trick: two quarter circles minus the square.\nLook for symmetry, pieces you can slide to a new place, and shapes that cancel. Leave π in the answer.\n> Joining the midpoints of any quadrilateral shape that is a rectangle or square gives a shape of exactly half the area.\n### Worked example\n:::worked m4t4 2',
    m5t0: '## Mean, median and mode\nThe **mean** is the total divided by the count. The **median** is the middle value of the sorted list. The **mode** is the most common value.\n:::visual barChart 3 5 4 6 2\nTurn means into totals. If a mean of 80 over 5 tests changes to 82 over 6 tests, the totals go from 400 to 492, so the new test was 92.\nFor two groups, use a weighted mean: total of everyone divided by the number of everyone. The class mean sits closer to the bigger group.\nAdding a constant shifts the mean and median but not the range. Multiplying changes all three.\n> A moving average slides a window along the data to smooth out spikes.\n### Worked example\n:::worked m5t0 2',
    m5t1: '## The fundamental counting rule\nIf a job has stages and stage 1 can be done in m ways, stage 2 in n ways, and so on, the whole job can be done in **m × n × ...** ways, as long as the stage choices do not depend on each other.\nA licence plate with 3 letters and 3 digits has 26 × 26 × 26 × 10 × 10 × 10 possibilities.\nIf there is a restriction, fill the **most restricted place first**. For an even 3 digit number, choose the last digit first.\nTo count divisors, write the number as primes. 360 = 2^{3} × 3^{2} × 5 has (3 + 1)(2 + 1)(1 + 1) = 24 divisors.\n> Building the good objects step by step is usually faster than counting all objects and subtracting the bad ones.\n### Worked example\n:::worked m5t1 2',
    m5t2: '## Permutations and combinations\nA **permutation** is an arrangement where order matters. n different objects can be lined up in n! = n × (n ' + MINUS + ' 1) × ... × 1 ways.\nChoosing k objects in order from n: n × (n ' + MINUS + ' 1) × ... for k terms.\nA **combination** is a selection where order does not matter. Divide the ordered count by k!, so C(n, k) = n(n ' + MINUS + ' 1)... ÷ k!.\nRepeated letters: divide by the factorial of each repeat count. BANANA has 6! ÷ (3! × 2!) = 60 arrangements.\nFor "must be together" glue them into a block. For "must not be together" take everything minus together. For "at least one" take everything minus none.\n> Ask yourself: does the order of my choices change the outcome?\n### Worked example\n:::worked m5t2 2',
    m5t3: '## Counting paths on a grid\nTo go from the bottom left corner to the top right corner using only right and up steps on an a by b grid, you need a rights and b ups. Choose which of the a + b steps are rights: C(a + b, a).\n:::visual pathGrid 4 3\nYou can also write numbers on the grid. Every corner gets the **sum** of the number to its left and the number below it.\nTo pass through a point, multiply the paths to the point by the paths from the point. To avoid a point, subtract the paths through it from the total.\nStaircases where you climb 1 or 2 steps at a time follow the same add the two before it pattern (Fibonacci).\n> Movement rules change the counting rule. Allow a diagonal and each corner adds three numbers.\n### Worked example\n:::worked m5t3 2',

  var L6 = {
    m6t0: '## The pigeonhole principle\nIf you put more pigeons than holes, some hole holds at least two pigeons. That is the whole idea, and it is powerful.\n:::visual pigeonholes 7 3\nSeven pigeons in three holes: the fullest hole has at least ceil(7 ÷ 3) = 3.\nFor "how many must I take to be sure" questions, **build the worst case**. Take as many as you can while still failing, then add one.\nSocks in 4 colours: worst case is one of each colour (4 socks) with no pair, so 5 socks guarantee a pair. To force 3 of one colour: 4 × 2 + 1 = 9.\nTo use the principle on numbers, you must invent the holes. Sort by remainder, by digit sum, or by the odd part of a number.\n> Step 1: decide what the holes are. Step 2: decide the worst case. Step 3: add one.\n### Worked example\n:::worked m6t0 2',
    m6t1: '## Cryptarithms: letters for digits\nIn a cryptarithm each letter is a different digit and no number starts with 0. The trick is to reason, not to guess.\n**Size first.** Two numbers of at most 4 digits add to less than 20 000, so a 5 digit answer must start with 1. In SEND + MORE = MONEY that gives M = 1.\nThe same idea shows that AABB + CC = DDEEE has **no solution**: AABB is at most 9988 and CC at most 99, so the sum is at most 10 087. But DDEEE with D not 0 is at least 11 000. Reasoning about size can save you a long search.\n**Repeated letters** give parity clues: in AB + AB the units digits B + B are always even.\n**Carries** are only ever 0 or 1 when adding two numbers. Work right to left and keep track of the carry.\nFor products, use the units digit: the last digit of the product depends only on the last digits of the factors.\n> Test each guess in every column before you keep it. One failed column kills the guess.\n### Worked example\n:::worked m6t1 2',
    m6t2: '## Logic grids and knights and knaves\nFor a logic grid draw a table with a row for each person and a column for each thing. A **tick** means certain. A **cross** means impossible.\n:::visual logicGrid Ann,Ben,Cy Cat,Dog,Fish|Chess,Golf,Judo 0.0=✗;1.1=✓\nWhen you place a tick, cross out the rest of its row and its column. When only one blank is left in a row or column, it must be a tick. Chain ticks: if Ann owns the cat and the cat owner plays chess, then Ann plays chess.\nFor **knights and knaves**, a knight always tells the truth and a knave always lies. List every possible assignment and test each statement. A person is a knight exactly when their own statement is true.\n> Do not guess. Every cell you fill in should come with a reason.\n### Worked example\n:::worked m6t2 2',
    m6t3: '## Parity: even and odd\nParity means even or odd. The rules: even + even = even, odd + odd = even, even + odd = odd. A product is odd only if every factor is odd.\nAn **invariant** is something that never changes. If every move keeps the parity of the total, the final number must have that parity. This proves things are impossible.\nColour a chessboard: every domino covers one light and one dark square. If the board has more squares of one colour, some squares can never be covered.\nA number has an odd number of divisors only if it is a perfect square, because divisors come in pairs (d and k ÷ d).\nThe sum of everyone\'s handshakes is even, so the number of people with an odd count is always even.\n> Ask: what stays the same after every move? That is usually the key.\n### Worked example\n:::worked m6t3 3'

  function drawQuestion(mid, part, rng, used, topicUse) {
    var topics = E.listTopics(mid).filter(function (t) { return t.tiers[part.tier - 1] > 0; });
    for (var round = 0; round < 8; round++) {
      var minUse = Math.min.apply(null, topics.map(function (t) { return topicUse[t.id] || 0; }));
      var pool = topics.filter(function (t) { return (topicUse[t.id] || 0) <= minUse + (round > 3 ? 1 : 0); });
      var topic = rpick(pool.length ? pool : topics, rng);
      for (var k = 0; k < 25; k++) {
        var q = E.generateQuestion(mid, topic.id, part.tier, { mc: true });
        if (q.options && q.options.length === 5 && !used[q.questionText]) { used[q.questionText] = true; topicUse[topic.id] = (topicUse[topic.id] || 0) + 1; return q; }
      }

  }

  /* Build a fresh 25 question contest. Returns { id, createdAt, items[], totalPoints } where each item is
     { n, part, points, moduleId, topicId, tier, seed, variant, q }. */
  function assemble(opts) {
    opts = opts || {};

      });

    return { id: 'gauss-' + Date.now().toString(36) + '-' + Math.floor(rng() * 1e6).toString(36), createdAt: Date.now(), items: items, totalPoints: sum(items.map(function (i) { return i.points; })) };
  }

  /* Score a finished contest. answers: { questionNumber: chosenOptionIndex }. spent: seconds per question. flags: { n: true }. */
  function score(test, answers, spent, flags) {
    answers = answers || {}; spent = spent || {}; flags = flags || {};
    var res = { score: 0, max: test.totalPoints, correct: 0, answered: 0, total: test.items.length, parts: {}, modules: {}, tiers: {}, items: [] };
    PARTS.forEach(function (p) { res.parts[p.id] = { label: p.label, blurb: p.blurb, total: 0, correct: 0, answered: 0, points: 0, max: 0, seconds: 0 }; });

      var partRows = PARTS.map(function (p) { var P = R.parts[p.id], w = P.max ? Math.round(100 * P.points / P.max) : 0; return '<div class="gs-barrow"><div><b>' + p.label + '</b> <span class="gs-muted">(' + p.blurb + ')</span></div><div class="gs-track"><div class="gs-fill' + (w < 50 ? ' gs-lo' : '') + '" style="width:' + w + '%"></div></div><div><b>' + P.points + '</b> / ' + P.max + ' points, ' + P.correct + ' of ' + P.total + ' correct</div></div>'; }).join('');
      var modRows = Object.keys(R.modules).sort().map(function (id) { var M = R.modules[id], w = M.total ? Math.round(100 * M.correct / M.total) : 0; return '<div class="gs-barrow"><div><b>Module ' + id.slice(1) + '</b><br><span class="gs-muted" style="font-size:.85em">' + esc(titles[id] || '') + '</span></div><div class="gs-track"><div class="gs-fill' + (w < 50 ? ' gs-lo' : '') + '" style="width:' + w + '%"></div></div><div><b>' + M.correct + '</b> of ' + M.total + '</div></div>'; }).join('');

  /* ==================================================================
     SELF TEST AND PUBLIC API
  ================================================================== */
  // Checks the contest engine. Returns { ok, runs, failures[] }. Run in the console: GaussSimulator.selfTest(5)

<script>

(function () {

    { id: 'm4', glyph: '△', title: 'Spatial Sense, Geometry & Measurement', blurb: 'Pythagoras in 2D and 3D. Composite solids. Angles and shaded areas.' },

  /* ==================================================================

    } else out.push('<span aria-current="page">' + n.label + '</span>');

  function titleOf() { if (route.view === 'learn' && route.arg && findTopic(route.arg)) return findTopic(route.arg).t.title; return NAV.filter(function (x) { return x.id === route.view; })[0].label; }

  /* ==================================================================

  function renderDash() {

      '<div class="em-two"><div class="em-card em-col"><label for="em-name" style="font-weight:700">Student name</label><input id="em-name" class="em-input" type="text" maxlength="30" value="' + esc(D.name) + '"><div class="em-muted" style="font-size:14px">Used in the dashboard greeting. Saved in this browser only.</div></div>' +
      '<div class="em-card em-col"><div style="font-weight:700">Backup and restore</div><div class="em-muted" style="font-size:14px">Progress lives in this browser. Save a backup file to move it to another device.</div><div class="em-row"><button class="em-btn" data-act="export">Save backup</button><label class="em-btn" style="cursor:pointer">Restore backup<input type="file" accept="application/json" id="em-import" class="em-sr"></label></div>' +
      '<div style="font-weight:700;margin-top:6px">Reset progress</div><div class="em-muted" style="font-size:14px">Clears points, topics, worksheet settings and Gauss attempts.</div><div class="em-row" id="em-reset"><button class="em-btn" data-act="askreset">Reset all progress</button></div></div></div>';
  }

  /* ==================================================================
     Feedback panel: rating, type, message. Saved in progress, and can open a prefilled GitHub issue.
  ================================================================== */
  var FB = { type: 'Idea', rating: 0, ctx: '' };
  var FB_TYPES = ['Question looks wrong', 'Lesson is confusing', 'Idea', 'Bug', 'Other'];
  function openFeedback(ctx, type) {
    FB = { type: type || 'Idea', rating: 0, ctx: ctx || (route.view + (route.arg ? ' ' + route.arg : '')) };
    if (/^question|^lesson/.test(FB.ctx)) FB.type = /^lesson/.test(FB.ctx) ? 'Lesson is confusing' : 'Question looks wrong';
    drawFeedback(''); var m = $('#em-fb'); m.hidden = false; var t = $('#fb-text'); if (t) t.focus();
  }
  function drawFeedback(text) {
    $('#em-fb-body').innerHTML = '<h2 class="em-disp" style="margin:0;font-size:26px;font-weight:800">Send feedback</h2><div class="em-muted" style="font-size:15px">Where: ' + esc(FB.ctx) + '</div>' +
      '<div style="font-weight:700">How is it going?</div><div class="em-stars" role="group" aria-label="Rating">' + [1, 2, 3, 4, 5].map(function (n) { return '<button data-act="star" data-n="' + n + '" class="' + (FB.rating >= n ? 'on' : '') + '" aria-label="' + n + ' of 5" aria-pressed="' + (FB.rating === n) + '">' + n + '</button>'; }).join('') + '</div>' +
      '<div style="font-weight:700">What is it about?</div><div class="em-row">' + FB_TYPES.map(function (t) { return '<button class="em-chip ' + (FB.type === t ? 'on' : '') + '" data-act="fbtype" data-t="' + esc(t) + '" aria-pressed="' + (FB.type === t) + '">' + t + '</button>'; }).join('') + '</div>' +
      '<label for="fb-text" style="font-weight:700">Tell us more</label><textarea id="fb-text" class="em-text" placeholder="What happened, or what would make this better?">' + esc(text) + '</textarea>' +
      '<div class="em-row"><button class="em-btn primary" data-act="fbsave">Save feedback</button><button class="em-btn" data-act="fbissue">Open GitHub issue</button><button class="em-btn" data-act="fbclose">Close</button></div>';
  }
  function fbText() { var t = $('#fb-text'); return t ? t.value.trim() : ''; }
  function fbBody() { return fbText() + '\n\n---\nWhere: ' + FB.ctx + '\nRating: ' + (FB.rating || 'none') + '\nApp: Enriched Math 8, engine ' + E.version + (G ? ', simulator ' + G.version : ''); }

  /* ==================================================================
     Events: one click handler for the whole page
  ================================================================== */
  function onClick(e) {
    var cm = e.target.closest('a[data-mod]'); if (cm) learnSel = cm.dataset.mod;
    var el = e.target.closest('[data-act]'); if (!el) { if (e.target === $('#em-fb')) $('#em-fb').hidden = true; return; }
    var a = el.dataset.act, m = el.dataset.m, t = el.dataset.t, i = +el.dataset.i, ws = D.worksheet;
    if (el.closest('.gs-root')) return; // the simulator handles its own buttons
    switch (a) {
      case 'open': D.unlocked[m] = true; learnSel = m; persist(); go('learn'); break;
      case 'lock': AppState.toggleUnlock(m); persist(); renderDash(); renderChrome(); break;
      case 'sel': learnSel = m; renderLearn(); break;
      case 'unlock': D.unlocked[m] = true; persist(); renderLearn(); break;
      case 'topic': { var was = !!D.completed[t]; AppState.toggleTopic(t); persist(); renderView(route.view); toast(was ? 'Topic unmarked.' : 'Topic mastered. +20 points.'); break; }
      case 'practiceTopic': ws.module = m; ws.topic = t; persist(); W.qs = []; go('practice'); break;
      case 'wsmod': ws.module = m; ws.topic = 'mixed'; persist(); W.qs = []; renderPractice(); break;
      case 'wstopic': ws.topic = t; persist(); W.qs = []; renderPractice(); break;
      case 'wstier': ws.tier = +el.dataset.n; persist(); W.qs = []; renderPractice(); break;
      case 'wscount': ws.count = +el.dataset.n; persist(); W.qs = []; renderPractice(); break;
      case 'wsopt': ws[el.dataset.k] = !ws[el.dataset.k]; persist(); W.qs = []; renderPractice(); break;
      case 'generate': generate(); break;
      case 'pick': W.pick = W.pick || {}; W.pick[i] = +el.dataset.k; refreshQ(i); break;
      case 'check': check(i); break;
      case 'hint': W.show[i] = !W.show[i]; refreshQ(i); break;
      case 'clearpad': { var c = $('#q-' + i + ' canvas'); c.getContext('2d').clearRect(0, 0, c.width, c.height); delete pads[i]; break; }
      case 'askreset': $('#em-reset').innerHTML = '<button class="em-btn primary" data-act="doreset">Yes, reset everything</button><button class="em-btn" data-act="cancelreset">Cancel</button>'; break;
      case 'cancelreset': $('#em-reset').innerHTML = '<button class="em-btn" data-act="askreset">Reset all progress</button>'; break;
      case 'doreset': AppState.reset(); persist(); try { window.localStorage.removeItem('enrichedMath8.gaussSession.v1'); } catch (x) { /* ignore */ } W.qs = []; D = AppState.data; go('dashboard'); onRoute(); toast('Progress reset.'); break;
      case 'export': { var url = URL.createObjectURL(new Blob([AppState.exportJson()], { type: 'application/json' })), dl = document.createElement('a'); dl.href = url; dl.download = 'enriched-math8-progress.json'; document.body.appendChild(dl); dl.click(); dl.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 500); break; }
      case 'feedback': openFeedback(); break;
      case 'report': openFeedback(el.dataset.ctx); break;
      case 'star': FB.rating = +el.dataset.n; var tx = fbText(); drawFeedback(tx); $('#fb-text').value = tx; break;
      case 'fbtype': FB.type = t; var tx2 = fbText(); drawFeedback(tx2); break;
      case 'fbsave': { var txt = fbText(); if (!txt && !FB.rating) return toast('Add a rating or a note first.'); AppState.addFeedback({ at: Date.now(), type: FB.type, rating: FB.rating, text: txt, ctx: FB.ctx }); persist(); $('#em-fb').hidden = true; toast('Thank you. Feedback saved.'); if (route.view === 'progress') renderProgress(); break; }
      case 'fbissue': { var tt = fbText(); window.open(REPO + '/issues/new?title=' + encodeURIComponent('[' + FB.type + '] ' + (tt.split('\n')[0].slice(0, 60) || FB.ctx)) + '&body=' + encodeURIComponent(fbBody()), '_blank', 'noopener'); break; }
      case 'fbclose': $('#em-fb').hidden = true; break;
    }
  }

  function init() {
    $('#em-nav').innerHTML = NAV.map(function (n) { return '<a id="nav-' + n.id + '" data-v="' + n.id + '" href="#/' + n.id + '"><span class="em-glyph" aria-hidden="true">' + n.glyph + '</span><span class="em-full">' + n.label + '</span><span class="em-short">' + n.short + '</span></a>'; }).join('');
    document.addEventListener('click', onClick);
    $('#em-theme').addEventListener('click', function () { AppState.toggleDark(); persist(); renderChrome(); });
    $('#em-feedback').addEventListener('click', function () { openFeedback(); });
    document.addEventListener('input', function (e) {
      if (e.target.id === 'em-name') { AppState.setName(e.target.value); persist(); }
      if (e.target.dataset && e.target.dataset.note !== undefined) W.notes[+e.target.dataset.note] = e.target.value;
    });
    document.addEventListener('change', function (e) {
      if (e.target.id === 'em-import' && e.target.files[0]) { var rd = new FileReader(); rd.onload = function () { try { AppState.importJson(rd.result); persist(); D = AppState.data; renderProgress(); renderChrome(); toast('Backup restored.'); } catch (x) { toast('That file is not a valid backup.'); } }; rd.readAsText(e.target.files[0]); }
    });
    document.addEventListener('toggle', function (e) { if (e.target.matches && e.target.matches('details.em-det') && e.target.open) initPad(e.target.querySelector('canvas')); }, true);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#em-fb').hidden) $('#em-fb').hidden = true; if (e.key === 'Enter' && e.target.id && e.target.id.indexOf('ans-') === 0) check(+e.target.id.slice(4)); });
    // The simulator listens for A to E and arrow keys on the whole page. Mute those keys on other tabs.
    window.addEventListener('keydown', function (e) { if (route.view !== 'gauss' && !/INPUT|TEXTAREA/.test((e.target && e.target.tagName) || '') && /^[a-fA-F]$|^Arrow/.test(e.key) && !(e.ctrlKey || e.metaKey)) e.stopImmediatePropagation(); }, true);
    window.addEventListener('hashchange', onRoute);
    setInterval(updatePill, 5000);
    onRoute();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
